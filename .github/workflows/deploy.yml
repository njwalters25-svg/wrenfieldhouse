name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Push dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: false

      - name: Pull and deploy via cPanel API
        run: |
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/VersionControl/retrieve"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "repository_root=/home/simpxlow/repositories/wrenfieldhouse"
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/VersionControlDeployment/create"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "repository_root=/home/simpxlow/repositories/wrenfieldhouse"

      - name: Rebuild LiteSpeed vhost config
        run: |
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/WebVhosts/rebuild_vhost_config"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}" || true
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/Domains/set_document_root"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "domain=wrenfieldhouse.com"             --data-urlencode "document_root=/home/simpxlow/wrenfieldhouse.com" || true
