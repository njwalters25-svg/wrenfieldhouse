name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Push dist to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          force_orphan: false

      - name: Pull and deploy via cPanel API
        run: |
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/VersionControl/retrieve"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "repository_root=/home/simpxlow/repositories/wrenfieldhouse"
          sleep 5
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/VersionControlDeployment/create"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "repository_root=/home/simpxlow/repositories/wrenfieldhouse"
          sleep 15

      - name: Write .htaccess via cPanel Fileman to trigger LiteSpeed reload
        run: |
          curl -s -X POST "https://premium43.web-hosting.com:2083/execute/Fileman/save_file_content"             -H "Authorization: cpanel simpxlow:${{ secrets.CPANEL_API_TOKEN }}"             --data-urlencode "dir=/home/simpxlow/wrenfieldhouse.com"             --data-urlencode "file=.htaccess"             --data-urlencode "content=DirectoryIndex index.html"
